{
  allVehicles(orderBy: PRIMARY_KEY_ASC) {
    nodes {
      __typename
      id
      name
      ... on Car {
        doors
      }
      ... on Truck {
        axles
      }
      ... on BoxTruck {
        volume
      }
      ... on Tanker {
        litres
      }
    }
  }
  allTrucks(orderBy: PRIMARY_KEY_ASC) {
    nodes {
      __typename
      id
      name
      axles
    }
  }
  allBoxTrucks {
    nodes {
      name
      servicesByVehicleId {
        nodes {
          note
        }
      }
      inspectionsByTruckId {
        nodes {
          note
        }
      }
    }
  }
  allTankers {
    nodes {
      servicesByVehicleId {
        nodes {
          note
        }
      }
    }
  }
}
