# `orderBy` and `condition` on a connection field of an interface
# (`Application.vulnerabilities`), as on the same field of its implementations.
{
  allPeople(first: 1) {
    nodes {
      username
      applications {
        nodes {
          __typename
          name
          ordered: vulnerabilities(orderBy: [CVSS_SCORE_DESC, NAME_ASC]) {
            nodes {
              __typename
              name
              cvssScore
            }
          }
          filtered: vulnerabilities(condition: { name: "XSS" }) {
            nodes {
              __typename
              name
            }
          }
        }
      }
    }
  }
}
